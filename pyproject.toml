[project]
name = "ferrite-bh-circuit"
version = "1.0.0"
description = "A data-driven, gain-scheduled equivalent circuit for the B-H behavior of power ferrites (MagNet Challenge 2 data)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.9.1",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "pyarrow",
    "openpyxl",
    "numba",
    "h5py>=3.16.0",
    "adjusttext>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ferrite_bh"]

[tool.hatch.build]
dev-mode-dirs = [".", "src"]          # editable install (uv sync): ferrite_bh and the scripts' modules in src/ importable

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# PyTorch for NVIDIA GPUs (CUDA 12.8, includes Triton). For an AMD GPU (the paper's results were computed on ROCm 6.4),
# set the index URL to https://download.pytorch.org/whl/rocm6.4, add "pytorch-triton-rocm" to the dependencies with
# the same index, and run `uv lock`.
[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pymupdf>=2.0",
    "pytest>=9.2.0",
    "ruff==0.14.3",
    "ty==0.0.95",
    "typst>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
include = ["src/**/*.py", "ferrite_bh/**/*.py", "tests/**/*.py", "paper/**/*.py"]

[tool.ty.src]
include = ["src", "ferrite_bh", "tests", "paper"]

[tool.ruff.lint]
extend-select = ["D100", "D101", "D102", "D103"]   # docstrings of modules, classes, methods and functions
# the code's compact style: several statements per line, grouped imports, short math names, assigned lambdas
ignore = ["E401", "E701", "E702", "E731", "E741"]
