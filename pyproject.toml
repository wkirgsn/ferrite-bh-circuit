[project]
name = "ferrite-bh-circuit"
version = "1.0.0"
description = "A data-driven, gain-scheduled equivalent circuit for the B-H behavior of power ferrites (MagNet Challenge 2 data)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.9.1",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "pyarrow",
    "openpyxl",
    "numba",
    "h5py>=3.16.0",
    "adjusttext>=1.4.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# PyTorch for NVIDIA GPUs (CUDA 12.8, includes Triton). For an AMD GPU (the paper's results were computed on ROCm 6.4),
# set the index URL to https://download.pytorch.org/whl/rocm6.4, add "pytorch-triton-rocm" to the dependencies with
# the same index, and run `uv lock`.
[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pymupdf>=2.0",
    "pytest>=9.2.0",
    "typst>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
